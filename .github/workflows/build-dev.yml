name: Build Vector Addon (Dev)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: build-dev
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Derive dev version from commit
        id: tag
        run: echo "tag=dev-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Read base image from build.yaml
        id: base
        run: echo "image=$(yq '.build_from.${{ matrix.arch }}' build.yaml)" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/hassos-addons-vector-${{ matrix.arch }}:dev
            ghcr.io/${{ github.repository_owner }}/hassos-addons-vector-${{ matrix.arch }}:${{ steps.tag.outputs.tag }}
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.image }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.tag.outputs.tag }}

  bump-addon:
    name: Point vector-dev addon at this build
    needs: build
    runs-on: ubuntu-latest
    env:
      HASSOS_ADDONS_PAT: ${{ secrets.HASSOS_ADDONS_PAT }}

    steps:
      - name: Skip without HASSOS_ADDONS_PAT
        if: env.HASSOS_ADDONS_PAT == ''
        run: echo "::notice::HASSOS_ADDONS_PAT not set, run 'make dev-bump' in hassos-addons instead"

      - name: Checkout hassos-addons
        if: env.HASSOS_ADDONS_PAT != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/hassos-addons
          token: ${{ secrets.HASSOS_ADDONS_PAT }}

      - name: Commit new dev version
        if: env.HASSOS_ADDONS_PAT != ''
        run: |
          version="dev-${GITHUB_SHA::7}"
          sed -i "s/^version: .*/version: \"$version\"/" vector-dev/config.yaml
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(vector-dev): point at $version"
          for _ in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
