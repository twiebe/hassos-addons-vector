data_dir: /data

sources:
  journal:
    type: journald
    journal_directory: /var/log/journal

transforms:
  mark:
    type: remap
    inputs: [journal]
    source: |
      .e2e_override = true

sinks:
  output:
    type: elasticsearch
    inputs: [mark]
    endpoints:
      - "http://172.30.32.1:9428/insert/elasticsearch"
    api_version: auto
    healthcheck:
      enabled: false
    query:
      _msg_field: message
      _time_field: timestamp
      _stream_fields: host
